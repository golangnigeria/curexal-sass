<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="500" height="120" fill="none">
  <!-- Brand Logo Symbol -->
  <g transform="translate(20, 15) scale(0.18)">
    <!-- Light Mint / Cyan Connecting Network Struts -->
    <g stroke="#56E3B8" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
      <line x1="250" y1="105" x2="375" y2="323" />
      <line x1="375" y1="323" x2="142" y2="198" />
      <line x1="125" y1="323" x2="352" y2="192" />
      <line x1="125" y1="323" x2="238" y2="368" />
    </g>

    <!-- Dark Hexagonal Perimeter Struts -->
    <g stroke="#1E2538" stroke-width="28" stroke-linecap="butt">
      <line x1="222" y1="120" x2="148" y2="163" />
      <line x1="278" y1="120" x2="352" y2="163" />
      <line x1="125" y1="205" x2="125" y2="295" />
      <line x1="375" y1="205" x2="375" y2="295" />
      <line x1="148" y1="337" x2="222" y2="380" />
      <line x1="352" y1="337" x2="278" y2="380" />
    </g>

    <!-- Central Iris / Precision Core -->
    <g>
      <circle cx="250" cy="250" r="70" stroke="#00DF9B" stroke-width="16" fill="#0F172A" />
      <circle cx="250" cy="250" r="42" fill="#2563EB" />
      <circle cx="250" cy="250" r="17" fill="#FFFFFF" />
    </g>

    <!-- 3 Turquoise Spherical Nodes -->
    <g fill="#00DF9B">
      <circle cx="250" cy="105" r="32" />
      <circle cx="375" cy="323" r="32" />
      <circle cx="125" cy="323" r="32" />
    </g>
  </g>

  <!-- Typography: CUREXAL -->
  <text x="125" y="66" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="900" font-size="40" letter-spacing="-0.5" fill="#0F172A">
    Curexal
  </text>

  <!-- Tagline: CONNECTED HEALTHCARE NETWORK -->
  <text x="126" y="88" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="700" font-size="10.5" letter-spacing="2.5" fill="#0F766E">
    CONNECTED HEALTHCARE NETWORK
  </text>
</svg>
