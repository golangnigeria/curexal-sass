<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="500" height="120" fill="none">
  <defs>
    <!-- Brand Gradients -->
    <linearGradient id="curexalTealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14B8A6" />
      <stop offset="50%" stop-color="#0F766E" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>

    <linearGradient id="curexalGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#0F766E" />
    </linearGradient>

    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Dark Container -->
  <rect width="500" height="120" rx="20" fill="#0B1120"/>

  <!-- Logo Mark Symbol (Interconnected Medical Cross & Network Node) -->
  <g transform="translate(30, 20)">
    <!-- Outer Shield / Halo -->
    <rect x="0" y="0" width="80" height="80" rx="24" fill="url(#curexalTealGrad)" opacity="0.15" />
    <rect x="0" y="0" width="80" height="80" rx="24" stroke="url(#curexalTealGrad)" stroke-width="2" />

    <!-- Cross & Network Nodes -->
    <path d="M40 16 V64 M16 40 H64" stroke="url(#curexalTealGrad)" stroke-width="6" stroke-linecap="round" filter="url(#glowEffect)" />
    
    <!-- Heartbeat Pulse Wave Overlay -->
    <path d="M22 40 L32 40 L37 28 L43 52 L48 36 L52 40 L58 40" stroke="#5EEAD4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Network Node Orbs -->
    <circle cx="40" cy="16" r="4" fill="#5EEAD4" />
    <circle cx="40" cy="64" r="4" fill="#5EEAD4" />
    <circle cx="16" cy="40" r="4" fill="#5EEAD4" />
    <circle cx="64" cy="40" r="4" fill="#5EEAD4" />
  </g>

  <!-- Typography: CUREXAL -->
  <text x="135" y="65" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="900" font-size="38" letter-spacing="1" fill="#FFFFFF">
    Curexal
  </text>

  <!-- Tagline: CONNECTED HEALTHCARE NETWORK -->
  <text x="136" y="88" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="700" font-size="11" letter-spacing="3" fill="#2DD4BF">
    CONNECTED HEALTHCARE NETWORK
  </text>
</svg>
