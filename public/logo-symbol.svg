<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" fill="none">
  <defs>
    <linearGradient id="curexalTealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14B8A6" />
      <stop offset="50%" stop-color="#0F766E" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>

    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Shield / Halo -->
  <rect x="0" y="0" width="80" height="80" rx="24" fill="url(#curexalTealGrad)" />

  <!-- Cross & Network Nodes -->
  <path d="M40 16 V64 M16 40 H64" stroke="#ffffff" stroke-width="6" stroke-linecap="round" filter="url(#glowEffect)" />
  
  <!-- Heartbeat Pulse Wave Overlay -->
  <path d="M22 40 L32 40 L37 28 L43 52 L48 36 L52 40 L58 40" stroke="#5EEAD4" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Network Node Orbs -->
  <circle cx="40" cy="16" r="4" fill="#ffffff" />
  <circle cx="40" cy="64" r="4" fill="#ffffff" />
  <circle cx="16" cy="40" r="4" fill="#ffffff" />
  <circle cx="64" cy="40" r="4" fill="#ffffff" />
</svg>
