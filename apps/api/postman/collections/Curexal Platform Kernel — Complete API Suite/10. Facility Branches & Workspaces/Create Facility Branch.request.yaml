$kind: http-request
url: "{{base_url}}/api/v1/organization/branches"
method: POST
headers:
  Authorization: Bearer {{auth_token}}
  X-CSRF-Token: "{{csrf_token}}"
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "facilityTypeId": "{{facility_type_id}}",
      "code": "branch-ikeja",
      "name": "Ikeja Diagnostic Center",
      "isHeadquarters": true,
      "email": "ikeja@everight.com",
      "phone": "+2348012345678",
      "address": "15 Allen Avenue, Ikeja",
      "city": "Lagos",
      "state": "Lagos",
      "country": "Nigeria"
    }
scripts:
  - type: afterResponse
    code: |-
      var json = pm.response.json();
      if (json.data && json.data.id) { pm.environment.set('branch_id', json.data.id); pm.environment.set('tenant_id', json.data.id); }
    language: text/javascript
order: 2000
