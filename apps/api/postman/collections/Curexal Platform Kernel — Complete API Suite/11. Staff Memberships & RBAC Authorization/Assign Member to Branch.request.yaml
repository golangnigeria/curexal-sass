$kind: http-request
url: "{{base_url}}/api/v1/organization/members/{{member_id}}/branches"
method: POST
headers:
  Authorization: Bearer {{auth_token}}
  X-CSRF-Token: "{{csrf_token}}"
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "facilityBranchId": "{{branch_id}}"
    }
order: 5000
