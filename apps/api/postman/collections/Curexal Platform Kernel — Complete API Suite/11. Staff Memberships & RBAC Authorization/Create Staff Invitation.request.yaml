$kind: http-request
url: "{{base_url}}/api/v1/organization/invitations"
method: POST
headers:
  Authorization: Bearer {{auth_token}}
  X-CSRF-Token: "{{csrf_token}}"
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "dr.nwosu@everight.com",
      "role": "clinician",
      "roleTitle": "Consultant Pathologist",
      "facilityBranchId": "{{branch_id}}"
    }
scripts:
  - type: afterResponse
    code: |-
      var json = pm.response.json();
      if (json.data && json.data.id) { pm.environment.set('invitation_id', json.data.id); }
      if (json.data && json.data.token) { pm.environment.set('invitation_token', json.data.token); }
    language: text/javascript
order: 2000
