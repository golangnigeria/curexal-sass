$kind: http-request
name: Set Password (Owner/Staff Setup)
description: Completes initial password setup for invited organization owners and staff via a single-use cryptographic setup token. No authentication required.
url: "{{base_url}}/api/v1/auth/set-password"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "token": "{{setup_token}}",
      "password": "OwnerSecurePassword123!"
    }
order: 17000
