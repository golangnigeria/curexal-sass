$kind: http-request
url: "{{base_url}}/api/v1/auth/csrf"
method: GET
headers:
  Authorization: Bearer {{auth_token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('CSRF token retrieved', function () {
          var json = pm.response.json();
          if (json.data && json.data.csrfToken) {
              pm.environment.set('csrf_token', json.data.csrfToken);
          }
      });
    language: text/javascript
order: 7000
