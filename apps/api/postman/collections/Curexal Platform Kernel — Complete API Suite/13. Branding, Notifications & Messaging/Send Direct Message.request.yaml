$kind: http-request
url: "{{base_url}}/api/v1/messages"
method: POST
headers:
  Authorization: Bearer {{auth_token}}
  X-CSRF-Token: "{{csrf_token}}"
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "recipientId": "{{user_id}}",
      "subject": "Urgent: Sample Rerun Required",
      "body": "Please rerun specimen #BC-89210-EDTA for FBC differential."
    }
order: 19000
