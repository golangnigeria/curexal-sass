$kind: http-request
url: "{{base_url}}/api/v1/notifications/preferences"
method: PUT
headers:
  Authorization: Bearer {{auth_token}}
  X-CSRF-Token: "{{csrf_token}}"
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "emailEnabled": true,
      "smsEnabled": false,
      "inAppEnabled": true
    }
order: 17000
