$kind: http-request
url: "{{base_url}}/api/v1/organization/catalogs"
method: POST
headers:
  Authorization: Bearer {{auth_token}}
  X-CSRF-Token: "{{csrf_token}}"
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "domainType": "LABORATORY",
      "code": "FBC",
      "name": "Full Blood Count with Differential",
      "basePrice": 5000.00,
      "currency": "NGN"
    }
scripts:
  - type: afterResponse
    code: |-
      var json = pm.response.json();
      if (json.data && json.data.id) { pm.environment.set('catalog_id', json.data.id); }
    language: text/javascript
order: 2000
