$kind: http-request
url: "{{base_url}}/api/v1/organization/catalogs/{{catalog_id}}/branch-prices"
method: POST
headers:
  Authorization: Bearer {{auth_token}}
  X-CSRF-Token: "{{csrf_token}}"
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "facilityBranchId": "{{branch_id}}",
      "overridePrice": 4500.00
    }
order: 5000
