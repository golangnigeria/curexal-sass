$kind: http-request
url: "{{base_url}}/api/v1/platform/config"
method: PUT
headers:
  Authorization: Bearer {{auth_token}}
  X-CSRF-Token: "{{csrf_token}}"
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "platformName": "Curexal Health OS",
      "supportEmail": "support@curexal.com"
    }
order: 4000
