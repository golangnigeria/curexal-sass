$kind: http-request
url: "{{base_url}}/api/v1/users/me/password"
method: PUT
headers:
  Authorization: Bearer {{auth_token}}
  X-CSRF-Token: "{{csrf_token}}"
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "currentPassword": "OldPassword123!",
      "newPassword": "BrandNewSecurePassword456!"
    }
order: 6000
