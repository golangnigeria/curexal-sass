$kind: http-request
url: "{{base_url}}/api/v1/organization/webhooks"
method: POST
headers:
  Authorization: Bearer {{auth_token}}
  X-CSRF-Token: "{{csrf_token}}"
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "Hospital EHR Event Listener",
      "targetUrl": "https://api.hospital-ehr.org/webhooks/curexal",
      "eventTypes": ["patient.created", "lab_order.authorized", "invoice.paid"]
    }
scripts:
  - type: afterResponse
    code: |-
      var json = pm.response.json();
      if (json.data && json.data.id) { pm.environment.set('webhook_id', json.data.id); }
    language: text/javascript
order: 5000
