$kind: http-request
url: "{{base_url}}/api/v1/lims/authorizations"
method: POST
headers:
  Authorization: Bearer {{auth_token}}
  X-CSRF-Token: "{{csrf_token}}"
  X-Tenant-ID: "{{tenant_id}}"
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "orderId": "{{order_id}}",
      "authorizerNotes": "Results reviewed and authorized for clinical correlation."
    }
order: 5000
