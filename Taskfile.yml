version: '3'

dotenv: ['.env', 'apps/api/.env']

includes:
  api:
    taskfile: ./apps/api/Taskfile.yml
    dir: ./apps/api

tasks:
  default:
    desc: list all available workspace tasks
    cmds:
      - task --list-all
    silent: true

  db:up:
    desc: start local PostgreSQL & Redis containers (Docker)
    cmds:
      - docker compose up -d

  db:down:
    desc: stop local PostgreSQL & Redis containers (Docker)
    cmds:
      - docker compose down

  db:logs:
    desc: view logs for local database containers
    cmds:
      - docker compose logs -f postgres

  db:seed:
    desc: seed platform admin and staff accounts into the database
    dir: apps/api
    cmds:
      - go run ./cmd/seed_admin

  db:reset:
    desc: clean database, run all migrations, and seed platform users
    dir: apps/api
    cmds:
      - go run ./cmd/clean_db
      - go run ./cmd/seed_admin

  reset-db:
    desc: alias for db:reset
    cmds:
      - task: db:reset


  build:
    desc: build all applications (native Go API + static Vite SPAs)
    cmds:
      - task: build:api
      - task: build:web-public
      - task: build:web-platform
      - task: build:web-patient

  build:api:
    desc: build native Go backend executable
    dir: apps/api
    cmds:
      - echo "==> Building Curexal API (Native Go Binary)..."
      - go build -ldflags="-w -s" -o bin/curexal-backend ./cmd/CUREXAL

  build:web-public:
    desc: build static marketing/demo SPA
    dir: apps/web-public
    cmds:
      - echo "==> Building Curexal Public Web (Static Vite SPA)..."
      - bun run build

  build:web-platform:
    desc: build static portal/workspace SPA
    dir: apps/web-platform
    cmds:
      - echo "==> Building Curexal Platform Portal (Static Vite SPA)..."
      - bun run build

  build:web-patient:
    desc: build static patient portal SPA
    dir: apps/web-patient
    cmds:
      - echo "==> Building Curexal Patient Portal (Static Vite SPA)..."
      - bun run build

  test:
    desc: run all backend unit and storage/cache tests
    dir: apps/api
    cmds:
      - echo "==> Running Backend Kernel Tests..."
      - go test -v ./internal/kernel/...

  dev:
    desc: run all applications concurrently (Go API on 8080 + Public Web on 5001 + Platform Portal on 5002 + Patient Portal on 5003)
    deps:
      - dev:api
      - dev:web-public
      - dev:web-platform
      - dev:web-patient

  run:
    desc: alias for task dev (runs all applications concurrently)
    cmds:
      - task: dev


  dev:api:
    desc: start native Go backend development server (Port 8080)
    dir: apps/api
    cmds:
      - go run ./cmd/CUREXAL

  dev:web-public:
    desc: start Public Web development server (Port 5001)
    dir: apps/web-public
    cmds:
      - bun run dev

  dev:web-platform:
    desc: start Platform Portal development server (Port 5002)
    dir: apps/web-platform
    cmds:
      - bun run dev

  dev:web-patient:
    desc: start Patient Portal development server (Port 5003)
    dir: apps/web-patient
    cmds:
      - bun run dev

  tidy:
    desc: format and tidy Go module dependencies
    dir: apps/api
    cmds:
      - go fmt ./...
      - go mod tidy
      - go mod verify

  fmt:
    desc: format Go code
    dir: apps/api
    cmds:
      - go fmt ./...

  lint:
    desc: run static analysis (go vet) on backend
    dir: apps/api
    cmds:
      - go vet ./...

  typecheck:
    desc: run TypeScript typecheck across all frontend applications
    cmds:
      - echo "==> Typechecking Web Platform..."
      - cmd: cd apps/web-platform && bun run typecheck
        platforms: [linux, darwin]
      - cmd: powershell -Command "cd apps\web-platform; bun run typecheck"
        platforms: [windows]
      - echo "==> Typechecking Web Public..."
      - cmd: cd apps/web-public && bun run typecheck
        platforms: [linux, darwin]
      - cmd: powershell -Command "cd apps\web-public; bun run typecheck"
        platforms: [windows]
      - echo "==> Typechecking Web Patient..."
      - cmd: cd apps/web-patient && bun run typecheck
        platforms: [linux, darwin]
      - cmd: powershell -Command "cd apps\web-patient; bun run typecheck"
        platforms: [windows]

  ci:
    desc: run all local CI checks (fmt, lint, test, typecheck, build)
    cmds:
      - task: fmt
      - task: lint
      - task: test
      - task: typecheck
      - task: build

  clean:
    desc: clean all built binaries and dist bundles
    cmds:
      - cmd: powershell -Command "Remove-Item -Recurse -Force apps\api\bin, apps\web-public\dist, apps\web-platform\dist, apps\web-patient\dist -ErrorAction SilentlyContinue"
        platforms: [windows]
      - cmd: rm -rf apps/api/bin apps/web-public/dist apps/web-platform/dist apps/web-patient/dist
        platforms: [linux, darwin]

